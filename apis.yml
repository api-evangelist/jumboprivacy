name: Jumbo Privacy
description: >-
  Jumbo (Jumbo Privacy) was a mobile-first consumer privacy and security assistant founded in 2019 by
  Pierre Valade, the co-founder of the Sunrise calendar app acquired by Microsoft. The iPhone/Android app
  helped everyday users take control of their online privacy by automatically hardening privacy settings
  across services like Google, Facebook, Twitter/X, Amazon, and LinkedIn, cleaning up old social posts,
  monitoring data breaches, and bundling identity-theft insurance. It was explicitly designed to process
  user data locally on-device with no server-side processing, so it never exposed a public developer API,
  SDK, or documented integration surface. Jumbo was backed by investors including Balderton Capital and
  Thrive Capital before being acqui-hired by cyber-insurer Coalition in 2023; the standalone consumer app
  was wound down and fully discontinued by 2024. This profile is retained in the API Evangelist network as
  a historical company record - there is no active API to enrich.
